<section class="demo-section" id="contact">
    <div class="container">
        <h3>📬 Contact Me</h3>
        <p class="section-description">
            Have questions about my work or want to collaborate? 
            I'd love to hear from you!
        </p>
        
        <div class="category-card contact-card">
            <form id="contactForm" class="contact-form" novalidate>
                <input 
                    type="text" 
                    name="website_hp" 
                    id="website_hp"
                    style="display:none !important; position: absolute; left: -9999px;" 
                    tabindex="-1" 
                    autocomplete="off"
                    aria-hidden="true">
                
                <div class="form-group">
                    <label for="contactName">Name *</label>
                    <input 
                        type="text" 
                        id="contactName" 
                        name="name"
                        placeholder="Your Name" 
                        required
                        minlength="2"
                        maxlength="100"
                        class="form-input">
                    <span class="form-error" id="nameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="contactEmail">Email *</label>
                    <input 
                        type="email" 
                        id="contactEmail" 
                        name="email"
                        placeholder="your.email@example.com" 
                        required
                        maxlength="150"
                        class="form-input">
                    <span class="form-error" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="contactMessage">Message *</label>
                    <textarea 
                        id="contactMessage" 
                        name="message"
                        placeholder="Type your message here..." 
                        required
                        minlength="10"
                        maxlength="5000"
                        rows="6"
                        class="form-input form-textarea"></textarea>
                    <span class="form-error" id="messageError"></span>
                    <span class="character-count" id="charCount">0 / 5000</span>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Send Message</span>
                    <span class="btn-icon">📧</span>
                </button>
                
                <div id="formResponse" class="form-response" role="alert" aria-live="polite"></div>
            </form>
        </div>
        </div>
    </div>
    <iframe 
    id="backend-bridge" 
    src="https://thmscmpg.github.io/backend-hub" 
    style="display:none; width:0; height:0; border:0;">
</iframe>
</section>

<style>
/* Contact Form Styles */
.contact-card {
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
}

.section-description {
    text-align: center;
    margin-bottom: 30px;
    color: #666;
    font-size: 1.1rem;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-weight: 600;
    color: #333;
    font-size: 0.95rem;
}

.form-input {
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s ease;
    background: #fff;
}

.form-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-input.error {
    border-color: #f44336;
}

.form-input.success {
    border-color: #4CAF50;
}

.form-textarea {
    resize: vertical;
    min-height: 120px;
}

.form-error {
    color: #f44336;
    font-size: 0.85rem;
    min-height: 20px;
    display: none;
}

.form-error.visible {
    display: block;
}

.character-count {
    text-align: right;
    font-size: 0.85rem;
    color: #999;
}

.submit-btn {
    padding: 14px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

.submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.submit-btn:active:not(:disabled) {
    transform: translateY(0);
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-icon {
    font-size: 1.2rem;
}

.form-response {
    padding: 15px;
    border-radius: 8px;
    font-weight: 500;
    text-align: center;
    display: none;
    animation: slideIn 0.3s ease;
}

.form-response.visible {
    display: block;
}

.success-msg {
    background: #e8f5e9;
    color: #2e7d32;
    border: 2px solid #4CAF50;
}

.error-msg {
    background: #ffebee;
    color: #c62828;
    border: 2px solid #f44336;
}

.contact-alternatives {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #e0e0e0;
}

.alt-contact-text {
    color: #666;
    font-size: 0.95rem;
}

.contact-link {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.contact-link:hover {
    color: #764ba2;
    text-decoration: underline;
}

.spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin-right: 8px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

    margin-top: 15px;

/* Responsive Design */
@media (max-width: 768px) {
    .contact-card {
        padding: 20px;
    }
    
    .submit-btn {
        width: 100%;
    }
}
</style>

<script>
(function() {
    'use strict';
    
    const CONFIG = {
        MAX_MESSAGE_LENGTH: 5000,
        MIN_MESSAGE_LENGTH: 10,
        BRIDGE_ID: 'backend-bridge',
        BRIDGE_ORIGIN: 'https://thmscmpg.github.io'
    };

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const responseDiv = document.getElementById('formResponse');

    // --- ASYNC BRIDGE HANDLER ---
    async function postToQueue(payload) {
        return new Promise((resolve, reject) => {
            const iframe = document.getElementById(CONFIG.BRIDGE_ID);
            if (!iframe) return reject("System Offline: Bridge missing");

            const requestId = `req_${Date.now()}`;
            
            // Listen for ACKNOWLEDGEMENT, not the final email result
            const handleAck = (event) => {
                if (!event.origin.includes('github.io')) return;
                if (event.data.id !== requestId) return;

                window.removeEventListener('message', handleAck);
                
                // If the bridge says "Received", we consider it a success for the UI
                if (event.data.status === 'received' || event.data.status === 'success') {
                    resolve({ message: "Message queued for delivery!" });
                } else {
                    reject(event.data.error || "Queue failed");
                }
            };

            window.addEventListener('message', handleAck);

            // Send data to the bridge
            iframe.contentWindow.postMessage({ 
                action: 'ENQUEUE_CONTACT', 
                id: requestId,
                payload: payload 
            }, '*');

            // Fast timeout: If bridge doesn't ACK in 5s, something is wrong
            setTimeout(() => {
                window.removeEventListener('message', handleAck);
                reject("Connection timeout");
            }, 5000);
        });
    }

    // --- FORM SUBMISSION ---
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Instant UI Feedback
            submitBtn.disabled = true;
            btnText.textContent = 'Processing...';
            responseDiv.classList.remove('visible');

            // 2. Data Prep
            const formData = {
                name: document.getElementById('contactName').value.trim(),
                email: document.getElementById('contactEmail').value.trim(),
                message: document.getElementById('contactMessage').value.trim(),
                ts: new Date().toISOString()
            };

            try {
                // 3. The Async Call
                const result = await postToQueue(formData);
                
                // 4. Instant Success (Don't wait for the email to actually send!)
                responseDiv.textContent = "✓ Success! Your message is in the queue.";
                responseDiv.className = "form-response visible success-msg";
                form.reset();
                document.getElementById('charCount').textContent = '0 / 5000';
                
            } catch (err) {
                responseDiv.textContent = `❌ ${err}`;
                responseDiv.className = "form-response visible error-msg";
                submitBtn.disabled = false;
            } finally {
                btnText.textContent = 'Send Message';
            }
        });
    }
})();
</script>

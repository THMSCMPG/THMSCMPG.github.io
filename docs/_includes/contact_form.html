<section class="demo-section" id="contact">
    <div class="container">
        <h3>📬 Contact Me</h3>
        <p class="section-description">
            Have questions about my work or want to collaborate? 
            I'd love to hear from you!
        </p>
        
        <div class="category-card contact-card">
            <form id="contactForm" class="contact-form" novalidate>
                <input 
                    type="text" 
                    name="website_hp" 
                    id="website_hp"
                    style="display:none !important; position: absolute; left: -9999px;" 
                    tabindex="-1" 
                    autocomplete="off"
                    aria-hidden="true">
                
                <div class="form-group">
                    <label for="contactName">Name *</label>
                    <input 
                        type="text" 
                        id="contactName" 
                        name="name"
                        placeholder="Your Name" 
                        required
                        minlength="2"
                        maxlength="100"
                        class="form-input">
                    <span class="form-error" id="nameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="contactEmail">Email *</label>
                    <input 
                        type="email" 
                        id="contactEmail" 
                        name="email"
                        placeholder="your.email@example.com" 
                        required
                        maxlength="150"
                        class="form-input">
                    <span class="form-error" id="emailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="contactMessage">Message *</label>
                    <textarea 
                        id="contactMessage" 
                        name="message"
                        placeholder="Type your message here..." 
                        required
                        minlength="10"
                        maxlength="5000"
                        rows="6"
                        class="form-input form-textarea"></textarea>
                    <span class="form-error" id="messageError"></span>
                    <span class="character-count" id="charCount">0 / 5000</span>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Send Message</span>
                    <span class="btn-icon">📧</span>
                </button>
                
                <div id="formResponse" class="form-response" role="alert" aria-live="polite"></div>
            </form>
        </div>
        </div>
    </div>
    <iframe 
    id="backend-bridge" 
    src="https://thmscmpg.github.io/backend-hub" 
    style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">
</iframe>
</section>

<style>
/* Contact Form Styles */
.contact-card {
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
}

.section-description {
    text-align: center;
    margin-bottom: 30px;
    color: #666;
    font-size: 1.1rem;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-weight: 600;
    color: #333;
    font-size: 0.95rem;
}

.form-input {
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s ease;
    background: #fff;
}

.form-input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.form-input.error {
    border-color: #f44336;
}

.form-input.success {
    border-color: #4CAF50;
}

.form-textarea {
    resize: vertical;
    min-height: 120px;
}

.form-error {
    color: #f44336;
    font-size: 0.85rem;
    min-height: 20px;
    display: none;
}

.form-error.visible {
    display: block;
}

.character-count {
    text-align: right;
    font-size: 0.85rem;
    color: #999;
}

.submit-btn {
    padding: 14px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

.submit-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.submit-btn:active:not(:disabled) {
    transform: translateY(0);
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-icon {
    font-size: 1.2rem;
}

.form-response {
    padding: 15px;
    border-radius: 8px;
    font-weight: 500;
    text-align: center;
    display: none;
    animation: slideIn 0.3s ease;
}

.form-response.visible {
    display: block;
}

.success-msg {
    background: #e8f5e9;
    color: #2e7d32;
    border: 2px solid #4CAF50;
}

.error-msg {
    background: #ffebee;
    color: #c62828;
    border: 2px solid #f44336;
}

.contact-alternatives {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid #e0e0e0;
}

.alt-contact-text {
    color: #666;
    font-size: 0.95rem;
}

.contact-link {
    color: #667eea;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.contact-link:hover {
    color: #764ba2;
    text-decoration: underline;
}

.spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

#form-status {
    margin-top: 15px;
    font-size: 0.9em;
    font-weight: bold;
    transition: all 5s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    .contact-card {
        padding: 20px;
    }
    
    .submit-btn {
        width: 100%;
    }
}
</style>

<script>
(function() {
    'use strict';
    
    const form = document.getElementById('contactForm');
    const nameInput = document.getElementById('contactName');
    const emailInput = document.getElementById('contactEmail');
    const messageInput = document.getElementById('contactMessage');
    const submitBtn = document.getElementById('submitBtn');
    const responseDiv = document.getElementById('formResponse');
    const charCount = document.getElementById('charCount');
    
    // Configuration
    const CONFIG = {
        // We no longer need the API_URL here, the Bridge handles it.
        MAX_MESSAGE_LENGTH: 5000,
        MIN_MESSAGE_LENGTH: 10,
        TIMEOUT: 45000 
    };
    
    // --- BRIDGE COMMUNICATION FUNCTION ---
    function sendToBridge(payload) {
        return new Promise((resolve, reject) => {
            // MATCHED ID: Using 'backend-bridge' as defined in your HTML
            const iframe = document.getElementById('backend-bridge');
            
            if (!iframe || !iframe.contentWindow) {
                reject(new Error("Bridge Hub not found or not loaded"));
                return;
            }

            const requestId = `REQ-${Date.now()}`;

            // Response Listener
            const handleResponse = (event) => {
                // Ensure the message is from your Hub
                if (!event.origin.includes('github.io') && !event.origin.includes('localhost')) return;
                if (event.data.id !== requestId) return;

                window.removeEventListener('message', handleResponse);
                
                if (event.data.status === 'success' || event.data.status === 'received') {
                    resolve(event.data);
                } else {
                    reject(new Error("Bridge reported a failure"));
                }
            };

            window.addEventListener('message', handleResponse);

            // The "Shout" across the bridge
            iframe.contentWindow.postMessage({ 
                action: 'SUBMIT_CONTACT', 
                id: requestId, 
                payload: payload 
            }, '*');

            // Timeout after 10 seconds
            setTimeout(() => {
                window.removeEventListener('message', handleResponse);
                reject(new Error("Bridge connection timed out"));
            }, 10000);
        });
    }

    // --- 2. FORM SUBMISSION HANDLER ---
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Define 'form' locally so it's always found
            const currentForm = e.target;
            const submitBtn = currentForm.querySelector('button[type="submit"]');
            const btnText = submitBtn.querySelector('.btn-text');
            const originalText = btnText ? btnText.textContent : 'Send Message';
            
            // 2. Validate all fields before doing anything
            const v1 = validateField('name', nameInput.value);
            const v2 = validateField('email', emailInput.value);
            const v3 = validateField('message', messageInput.value);
            
            if (!v1 || !v2 || !v3) {
                showResponse('Please fix the errors above', false);
                return;
            }
    
            // 3. UI Loading State
            submitBtn.disabled = true;
            if (btnText) btnText.textContent = 'Routing...';
    
            // 4. Prepare Data
            const formData = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim(),
                message: messageInput.value.trim(),
                website_hp: document.getElementById('website_hp')?.value || ''
            };
    
            // 5. The Fetch and Bridge Logic
            try {
                // First: Log the attempt to the Hub immediately
                const bridge = document.getElementById('backend-bridge');
                if (bridge) {
                    bridge.contentWindow.postMessage({
                        action: 'SUBMIT_CONTACT',
                        id: `TRY-${Date.now()}`,
                        payload: { info: 'Contact attempt started' }
                    }, '*');
                }
    
                // Second: The Actual Backend Request
                const response = await fetch('https://aura-mf-backend.onrender.com/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
    
                if (response.ok) {
                    const confirmation = await response.json();
                    
                    // Success: Tell the Hub to tick +1
                    if (bridge) {
                        bridge.contentWindow.postMessage({
                            action: 'RENDER_CONFIRMED', 
                            id: confirmation.timestamp || Date.now()
                        }, '*');
                    }
    
                    showResponse('Success! Your message was routed.', true);
                    currentForm.reset();
                    if (charCount) charCount.textContent = '0 / 5000';
                } else {
                    throw new Error(`Server error: ${response.status}`);
                }
    
            } catch (err) {
                console.error('Submission Error:', err);
                showResponse(err.message || 'Communication failed', false);
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                if (btnText) btnText.textContent = originalText;
            }
        });
    }
    
    function showError(inputId, message) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(`${inputId.replace('contact', '').toLowerCase()}Error`);
        if (input && errorSpan) {
            input.classList.add('error');
            input.classList.remove('success');
            errorSpan.textContent = message;
            errorSpan.classList.add('visible');
        }
    }

    function clearError(inputId) {
        const input = document.getElementById(inputId);
        const errorSpan = document.getElementById(`${inputId.replace('contact', '').toLowerCase()}Error`);
        if (input && errorSpan) {
            input.classList.remove('error');
            input.classList.add('success');
            errorSpan.textContent = '';
            errorSpan.classList.remove('visible');
        }
    }

    function validateField(fieldName, value) {
        const error = validators[fieldName](value);
        const inputId = `contact${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)}`;
        if (error) { showError(inputId, error); return false; }
        else { clearError(inputId); return true; }
    }

    // Event Listeners for validation
    if (nameInput) nameInput.addEventListener('blur', () => validateField('name', nameInput.value));
    if (emailInput) emailInput.addEventListener('blur', () => validateField('email', emailInput.value));
    if (messageInput) {
        messageInput.addEventListener('blur', () => validateField('message', messageInput.value));
        messageInput.addEventListener('input', () => {
            if (charCount) charCount.textContent = `${messageInput.value.length} / ${CONFIG.MAX_MESSAGE_LENGTH}`;
        });
    }

    function showResponse(message, isSuccess) {
        if (!responseDiv) return;
        responseDiv.textContent = message;
        responseDiv.className = `form-response visible ${isSuccess ? 'success-msg' : 'error-msg'}`;
        if (isSuccess) setTimeout(() => responseDiv.classList.remove('visible'), 5000);
    }
    
    async function handleContactSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const button = form.querySelector('button[type="submit"]');
        const btnText = button.querySelector('.btn-text');
        const statusDiv = document.getElementById('form-status');
    
        // 1. DATA COLLECTION & VALIDATION
        const formData = {
            name: document.getElementById('contactName').value.trim(),
            email: document.getElementById('contactEmail').value.trim(),
            message: document.getElementById('contactMessage').value.trim()
        };
    
        if (!validateField('name', formData.name) || 
            !validateField('email', formData.email) || 
            !validateField('message', formData.message)) {
            return; 
        }
    
        // 2. ENTER "LOADING" STATE (Spinning)
        const originalText = btnText.textContent;
        button.disabled = true;
        button.innerHTML = `<span class="spinner"></span> <span class="btn-text">Sending...</span>`;
        if (statusDiv) statusDiv.textContent = '';
    
        try {
            // 3. SEND TO RENDER
            const response = await fetch('https://aura-mf-backend.onrender.com/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
    
            if (response.ok) {
                // 4. ENTER "SUCCESS" STATE
                button.style.background = '#4CAF50'; // Turn Green
                button.innerHTML = `<span class="btn-icon">✓</span> <span class="btn-text">Sent!</span>`;
                
                if (statusDiv) {
                    statusDiv.textContent = 'Message delivered successfully!';
                    statusDiv.style.color = '#4CAF50';
                }
    
                // Tell the Hub to tick +1
                const hub = document.getElementById('backend-bridge');
                if (hub) {
                    hub.contentWindow.postMessage({
                        action: 'RENDER_CONFIRMED',
                        id: `ID-${Date.now()}`
                    }, '*');
                }
    
                form.reset();
                // Reset button after 3 seconds
                setTimeout(() => {
                    button.disabled = false;
                    button.style.background = ''; // Reverts to CSS gradient
                    button.innerHTML = `<span class="btn-text">${originalText}</span> <span class="btn-icon">📧</span>`;
                }, 3000);
    
            } else {
                throw new Error('Server error');
            }
        } catch (err) {
            // 5. ENTER "ERROR" STATE
            button.disabled = false;
            button.style.background = '#f44336'; // Turn Red
            button.innerHTML = `<span class="btn-text">Try Again</span>`;
            if (statusDiv) {
                statusDiv.textContent = 'Error: ' + err.message;
                statusDiv.style.color = '#f44336';
            }
        }
    }
    
    console.log('✓ Contact form initialized with Bridge');
})();
</script>

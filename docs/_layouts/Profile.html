<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <link rel="icon" href="{{ '/portfolio/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --accent: #10b981;
      --info: #0ea5e9;
      --warning: #f59e0b;
      --dark: #0f172a;
      --text: #1f2937;
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--primary); }
    .site-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      text-decoration: none;
      color: var(--dark);
      font-weight: 700;
    }
    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--dark);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 1rem;
      cursor: pointer;
    }
    .site-nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .site-nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
    }
    .site-nav a:hover { color: var(--primary); }
    @media (max-width: 760px) {
      .menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
      .site-nav {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        padding-top: 10px;
      }
      .site-nav.is-open { display: flex; }
      .site-nav a { width: 100%; padding: 6px 0; }
    }
    main {
      max-width: 980px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }
    h1, h2, h3, h4 {
      color: var(--dark);
      line-height: 1.25;
    }
    .content-area,
    .category-card,
    .theory-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .demo-section {
      margin: 28px 0;
    }
    .btn-link {
      display: inline-block;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 700;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      font-weight: 500;
    }
    .site-footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 20px 30px;
      color: #6b7280;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects' | relative_url }}">Projects</a>
        <a href="{{ '/reports' | relative_url }}">Reports</a>
        <a href="{{ '/CircuitNotes/' | relative_url }}">CircuitNotes</a>
        <a href="{{ '/portfolio/Campagna_CV_2025.pdf' | relative_url }}">CV</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    © {{ "now" | date: "%Y" }} {{ site.author | default: site.title }}
  </footer>
  <script>
    (function () {
      var btn = document.getElementById('menu-toggle');
      var nav = document.getElementById('site-nav');
      if (!btn || !nav) return;
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>

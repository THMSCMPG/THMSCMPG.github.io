
# Site Metadata
name: ""
title: Thomas Campagna
email: thmscmpgn@gmail.com
description: >-
  Undergraduate Physics & Math Student at Austin Peay State University. 
  Aspiring Computational Physicist specializing in Photonics and Environmental Physics.
author: Thomas Campagna
lang: en-US
timezone: America/Chicago

# Deployment Settings
url: "https://THMSCMPG.github.io"
baseurl: ""  # Empty for root site

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass Configuration
sass:
  sass_dir: _sass
  style: compressed  # Minified for production
  sourcemap: never   # Disable for production

# Kramdown Configuration
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
    span:
      line_numbers: false

# SEO & Social
social:
  name: Thomas Campagna
  links:
    - https://github.com/THMSCMPG

# Site Assets
favicon: /assets/favicon.png

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - .sass-cache
  - package.json
  - package-lock.json

# Include dotfiles (if needed)
include:
  - .well-known

# Defaults for front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "Profile"
      author: "Thomas Campagna"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Thomas Campagna</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #10b981; --dark: #0f172a; --light: #f8fafc; --border: #e2e8f0; --text: #334155; }
        body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; background-color: var(--light); color: var(--text); line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .navbar { background: white; padding: 1rem 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.2rem; text-decoration: none; color: var(--dark); }
        .nav-links { list-style: none; display: flex; gap: 20px; margin: 0; }
        .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--primary); }
        header.page-header { background: white; padding: 60px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px; text-align: center;}
        header h1 { font-size: 2.5rem; color: var(--dark); margin: 0; }
        .content-area { background: white; padding: 40px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        /* Markdown Styling Overrides */
        h2 { border-left: 4px solid var(--primary); padding-left: 15px; color: var(--dark); margin-top: 40px; }
        a { color: var(--primary); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border); }
        .footer { text-align: center; padding: 40px 0; color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="https://thmscmpg.github.io/" class="logo"><i class="fas fa-bolt-lightning"></i> THMSCMPG</a>
            <ul class="nav-links">
                <li><a href="https://thmscmpg.github.io/">Home</a></li>
                <li><a href="https://thmscmpg.github.io/projects/">Research</a></li>
                <li><a href="https://thmscmpg.github.io/reports/">Lab Reports</a></li>
                <li><a href="https://thmscmpg.github.io/CircuitNotes/">CircuitNotes</a></li>
                <li><a href="https://github.com/THMSCMPG"><i class="fab fa-github"></i> GitHub</a></li>

            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>{{ page.title }}</h1>
        </div>
    </header>

    <main class="container">
        <div class="content-area">
            {{ content }}
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Thomas Campagna | Physics & Mathematics</p>
    </footer>

</body>
</html>
